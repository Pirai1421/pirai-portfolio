server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: portfolio-backend

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  timeout-seconds: 15

portfolio:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://portfolio-git-master-pirai-soodan-gs-projects.vercel.app}
  rate-limit:
    requests-per-minute: 30
